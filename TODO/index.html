<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1 class="app-title">Todo List</h1>

        <div class="weekly-navigator">
            <button id="prev-week-btn" class="nav-btn">◀</button>
            <h2 id="current-week-display"></h2>
            <button id="next-week-btn" class="nav-btn">▶</button>
        </div>
        
        <div class="weekly-calendar" id="weekly-calendar">
            </div>
        <div class="input-container">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요">
            <button id="add-btn">추가</button>
        </div>

        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="todo-list" class="todo-list">
            </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
