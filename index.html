<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <h1 class="header-title">Task Tracker</h1>

        <div class="week-nav">
            <button id="btn-prev-week" class="nav-btn">◀</button>
            <h2 id="week-display"></h2>
            <button id="btn-next-week" class="nav-btn">▶</button>
        </div>
        
        <div class="calendar-wrapper" id="calendar-wrapper"></div>
        
        <div class="input-box">
            <input type="text" id="task-input" placeholder="할 일을 입력하세요">
            <button id="btn-add">추가</button>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="task-container" class="task-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
